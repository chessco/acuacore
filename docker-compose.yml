services:
  mysql:
    image: mysql:8
    container_name: luxury-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: acuacore_pass
      MYSQL_DATABASE: acuacore_db
    ports:
      - "3314:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pitaya_net

  postgres:
    image: ankane/pgvector:latest
    container_name: acua-core-postgres
    restart: always
    environment:
      POSTGRES_USER: acuacore_user
      POSTGRES_PASSWORD: acuacore_pass
      POSTGRES_DB: acuacore_vectors
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pitaya_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: acua-core-api
    restart: always
    environment:
      DATABASE_URL: "mysql://root:acuacore_pass@luxury-mysql-prod:3306/acuacore_db"
      VECTOR_DATABASE_URL: "postgresql://acuacore_user:acuacore_pass@acua-core-postgres:5432/acuacore_vectors"
      PORT: 3014
    ports:
      - "3014:3014"
    networks:
      - pitaya_net
    depends_on:
      - mysql
      - postgres

  flow:
    image: node:20-alpine
    container_name: flow
    restart: always
    command: ["tail", "-f", "/dev/null"] # Placeholder for flow service
    networks:
      - pitaya_net

networks:
  pitaya_net:
    external: true

volumes:
  mysql_data:
  postgres_data:
